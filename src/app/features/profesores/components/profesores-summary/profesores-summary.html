<section class="summary" aria-label="Resumen demostrativo de profesores">
  @for (card of cards(); track card.label) {
    <article class="summary-card" [class]="'summary-card summary-card--' + card.tone">
      <div class="summary-card__copy">
        <span>{{ card.label }}</span>
        <strong>{{ card.value }}</strong>
        <small>{{ card.note }}</small>
      </div>
      <div class="summary-card__icon">
        <app-ui-icon [name]="card.icon" [size]="24" />
      </div>
    </article>
  }
</section>
